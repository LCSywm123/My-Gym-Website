<!DOCTYPE html>
<html>
<head>
    <title>My Gym Plan</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 5px;
        }

        h2 {
            margin-top: 10px;
        }

        .date {
            color: #aaa;
            margin-bottom: 20px;
        }

        /* ================= TOP BUTTONS ================= */

        .top-buttons {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #111;
            padding: 10px 0;
            margin-bottom: 10px;
        }

        .top-buttons button {
            padding: 10px 16px;
            margin: 4px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .clear-button {
            background: #8b2222;
            color: white;
        }

        /* ================= WORKOUT ================= */

        .workout {
            background: #222;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 1000px;
        }

        .exercise {
            margin-bottom: 50px;
        }

        .exercise h3 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .exercise-info {
            color: #ccc;
            font-size: 17px;
        }

        .exercise img {
            width: 300px;
            max-width: 100%;
            border-radius: 15px;
            margin: 15px 0;
        }

        /* ================= SET RECORD ================= */

        .sets {
            max-width: 700px;
            margin: 20px auto;
        }

        .set-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            background: #333;
            flex-wrap: wrap;
            transition: 0.2s;
        }

        .set-row.completed {
            background: #1f6335;
        }

        .set-number {
            width: 55px;
            font-weight: bold;
        }

        .set-row input {
            width: 75px;
            padding: 10px;
            border: none;
            border-radius: 7px;
            text-align: center;
            font-size: 16px;
            background: white;
            color: black;
        }

        .set-row input:focus {
            outline: 2px solid #888;
        }

        .complete-button {
            padding: 10px 14px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            background: #eee;
            color: black;
        }

        .set-row.completed .complete-button {
            background: #38a169;
            color: white;
        }

        .set-progress {
            font-size: 16px;
            font-weight: bold;
            color: #ddd;
        }

        /* ================= REST ================= */

        .exercise-rest {
            margin-top: 15px;
        }

        .exercise-rest p {
            color: #aaa;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .rest-button {
            padding: 10px 16px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* =================================================
           FLOATING REST TIMER
        ================================================= */

        .timer {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 1000;

            background: #222;

            padding: 10px 12px;

            border-radius: 12px;

            width: 130px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.5);

            text-align: center;
        }

        .timer h2 {
            font-size: 13px;

            margin: 0 0 6px 0;

            color: #ccc;
        }

        .timer select {
            padding: 5px;

            border-radius: 6px;

            font-size: 12px;

            background: #333;

            color: white;

            border: none;

            width: 100%;
        }

        #timer {
            font-size: 28px;

            font-weight: bold;

            margin: 7px 0;
        }

        .timer button {
            padding: 5px 6px;

            margin: 2px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 11px;

            background: #444;

            color: white;
        }

        .timer button:hover {
            background: #666;
        }

        #finishedMessage {
            display: none;

            background: #444;

            padding: 6px;

            margin: 6px auto;

            border-radius: 7px;

            font-size: 11px;

            font-weight: bold;

            max-width: 120px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body {
                padding: 8px;
            }

            h1 {
                font-size: 30px;
            }

            h2 {
                font-size: 22px;
            }

            .workout {
                width: 100%;
                padding: 15px 10px;
                margin: 12px auto;
            }

            .exercise {
                margin-bottom: 40px;
            }

            .exercise h3 {
                font-size: 20px;
                line-height: 1.4;
            }

            .exercise-info {
                font-size: 15px;
            }

            .exercise img {
                width: 260px;
            }

            .set-row {
                display: grid;
                grid-template-columns: 55px 1fr 30px 1fr 35px;
                gap: 6px;
                padding: 12px 7px;
            }

            .set-number {
                width: auto;
                font-size: 13px;
            }

            .set-row input {
                width: 100%;
                min-width: 0;
                height: 42px;
                font-size: 16px;
            }

            .set-row span {
                font-size: 13px;
            }

            .complete-button {
                grid-column: 1 / -1;
                width: 100%;
                height: 42px;
                font-size: 15px;
            }

            .rest-button {
                width: 100%;
                height: 45px;
                font-size: 15px;
            }

            .top-buttons {
                padding: 5px 0;
            }

            .top-buttons button {
                font-size: 13px;
                padding: 10px 12px;
            }

            /* =================
               MOBILE FLOATING TIMER
            ================= */

            .timer {
                right: 10px;
                bottom: 10px;

                width: 105px;

                padding: 8px;

                border-radius: 10px;
            }

            .timer h2 {
                font-size: 11px;
                margin-bottom: 4px;
            }

            .timer select {
                font-size: 10px;
                padding: 4px;
            }

            #timer {
                font-size: 23px;
                margin: 5px 0;
            }

            .timer button {
                padding: 5px;

                font-size: 10px;

                margin: 1px;
            }

            #finishedMessage {
                font-size: 9px;
                padding: 5px;
            }
        }

    </style>
</head>


<body>

<h1>🏋️ My Gym Plan</h1>

<p>My Personal Workout Website</p>

<div class="date">
    📅 Today: <span id="todayDate"></span>
</div>


<!-- ================= TOP BUTTONS ================= -->

<div class="top-buttons">

    <button onclick="scrollToSection('push')">
        🔴 PUSH
    </button>

    <button onclick="scrollToSection('pull')">
        🔵 PULL
    </button>

    <button onclick="scrollToSection('legs')">
        🟢 LEGS
    </button>

    <button class="clear-button" onclick="clearToday()">
        🗑️ 清除今天记录
    </button>

</div>


<!-- ================================================= -->
<!-- ================= WORKOUTS ====================== -->
<!-- ================================================= -->

<div id="workouts"></div>


<!-- ================================================= -->
<!-- ================= FLOATING REST TIMER =========== -->
<!-- ================================================= -->

<div class="timer">

    <h2>⏱️ Rest Timer</h2>

    <select id="restTime">

        <option value="60">60 秒</option>
        <option value="90">90 秒</option>
        <option value="120">120 秒</option>
        <option value="150">150 秒</option>
        <option value="180" selected>180 秒</option>

    </select>

    <div id="timer">
        3:00
    </div>

    <div id="finishedMessage">
        ⏰ 休息结束！开始下一组！
    </div>

    <button onclick="startTimer()">
        ▶️ Start
    </button>

    <button onclick="pauseTimer()">
        ⏸️ Pause
    </button>

    <button onclick="resetTimer()">
        🔄 Reset
    </button>

</div>


<script>

/* =================================================
   WORKOUT DATA
================================================= */

const workouts = [

    {
        id: "push",
        title: "🔴 PUSH DAY 推日",
        exercises: [

            {
                name: "Bench Press 平板卧推",
                info: "4 × 6-10",
                image: "bench.jpg",
                sets: 4,
                rest: 180
            },

            {
                name: "Incline Dumbbell Press 上斜哑铃卧推",
                info: "3 × 8-12",
                image: "inclinedumbbellpress.jpg",
                sets: 3,
                rest: 120
            },

            {
                name: "Chest Fly 夹胸",
                info: "3 × 10-15",
                image: "chestflys.jpg",
                sets: 3,
                rest: 90
            },

            {
                name: "Cable Lateral Raise 绳索侧平举",
                info: "4 × 12-20",
                image: "cablelateralraise.jpg",
                sets: 4,
                rest: 60
            },

            {
                name: "Cable Single Arm Triceps Pushdown 单臂绳索三头下压",
                info: "3 × 10-15",
                image: "cablesinglearmtricepspushdown.jpg",
                sets: 3,
                rest: 90
            },

            {
                name: "Cable Overhead Triceps Extension 绳索过头三头伸展",
                info: "3 × 10-15",
                image: "cableoverheadtricepextension.jpg",
                sets: 3,
                rest: 90
            }

        ]
    },


    {
        id: "pull",
        title: "🔵 PULL DAY 拉日",
        exercises: [

            {
                name: "Lat Pulldown 高位下拉",
                info: "4 × 6-10",
                image: "latpulldown.jpg",
                sets: 4,
                rest: 120
            },

            {
                name: "Seated Cable Row 坐姿绳索划船",
                info: "3 × 8-12",
                image: "seatedcablerow.jpg",
                sets: 3,
                rest: 120
            },

            {
                name: "Single-Arm Chest-Supported Row 单手靠胸划船",
                info: "3 × 8-12",
                image: "onearmseatedmachinerow.jpg",
                sets: 3,
                rest: 120
            },

            {
                name: "Face Pull 绳索面拉",
                info: "3 × 12-20",
                image: "facepull.jpg",
                sets: 3,
                rest: 90
            },

            {
                name: "EZ-Bar Preacher Curl 牧师凳弯举",
                info: "3 × 8-12",
                image: "ezbarbellpreachercurl.jpg",
                sets: 3,
                rest: 90
            },

            {
                name: "Rope Hammer Curl 绳索锤式弯举",
                info: "3 × 10-15",
                image: "ropehammercurl.jpg",
                sets: 3,
                rest: 90
            }

        ]
    },


    {
        id: "legs",
        title: "🟢 LEG DAY 腿日",
        exercises: [

            {
                name: "Barbell Squat 杠铃深蹲",
                info: "4 × 6-10",
                image: "barbellsquart.jpg",
                sets: 4,
                rest: 180
            },

            {
                name: "Leg Press 腿举",
                info: "3 × 8-12",
                image: "legpress.jpg",
                sets: 3,
                rest: 150
            },

            {
                name: "Leg Curl 仰卧腿弯举",
                info: "3 × 10-15",
                image: "legcurl.jpg",
                sets: 3,
                rest: 90
            },

            {
                name: "Leg Extension 器械腿屈伸",
                info: "3 × 10-15",
                image: "legextension.jpg",
                sets: 3,
                rest: 90
            },

            {
                name: "Calf Raise 小腿提踵",
                info: "4 × 12-20",
                image: "calfraise.jpg",
                sets: 4,
                rest: 90
            }

        ]
    }

];


/* =================================================
   STORAGE
================================================= */

const STORAGE_KEY = "myGymWorkoutData";


function getToday() {

    const today = new Date();

    return today.getFullYear() +
        "-" +
        String(today.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(today.getDate()).padStart(2, "0");

}


const today = getToday();


document.getElementById("todayDate").textContent = today;


function loadData() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (!saved) {
        return {};
    }

    try {

        return JSON.parse(saved);

    } catch {

        return {};

    }

}


function saveData(data) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =================================================
   CREATE WORKOUT
================================================= */

function createWorkouts() {

    const container =
        document.getElementById("workouts");

    container.innerHTML = "";

    const savedData = loadData();


    workouts.forEach(function(day) {

        const workout =
            document.createElement("div");

        workout.className = "workout";

        workout.id = day.id;


        const title =
            document.createElement("h2");

        title.textContent = day.title;

        workout.appendChild(title);


        day.exercises.forEach(function(exercise, exerciseIndex) {

            const exerciseDiv =
                document.createElement("div");

            exerciseDiv.className = "exercise";


            const exerciseId =
                day.id + "-" + exerciseIndex;


            exerciseDiv.dataset.exercise =
                exerciseId;


            exerciseDiv.innerHTML = `

                <h3>${exercise.name}</h3>

                <p class="exercise-info">
                    ${exercise.info}
                </p>

                <img
                    src="images/${exercise.image}"
                    alt="${exercise.name}"
                >

                <div class="sets"></div>

                <p class="set-progress">
                    Progress:
                    <span>0 / ${exercise.sets} Sets</span>
                </p>

                <div class="exercise-rest">

                    <p>
                        ⏱️ 推荐休息：
                        ${exercise.rest} 秒
                    </p>

                    <button
                        class="rest-button"
                        onclick="setRest(${exercise.rest})"
                    >
                        开始休息 ${exercise.rest}s
                    </button>

                </div>
            `;


            const setsContainer =
                exerciseDiv.querySelector(".sets");


            for (
                let setNumber = 1;
                setNumber <= exercise.sets;
                setNumber++
            ) {

                const row =
                    document.createElement("div");

                row.className = "set-row";


                row.innerHTML = `

                    <span class="set-number">
                        Set ${setNumber}
                    </span>

                    <input
                        type="number"
                        step="0.5"
                        placeholder="重量"
                        class="weight-input"
                    >

                    <span>kg</span>

                    <input
                        type="number"
                        placeholder="Reps"
                        class="reps-input"
                    >

                    <span>reps</span>

                    <button
                        class="complete-button"
                        onclick="completeSet(this)"
                    >
                        ⬜ 完成
                    </button>

                `;


                setsContainer.appendChild(row);


                /* LOAD SAVED DATA */

                const saved =
                    savedData[today] &&
                    savedData[today][exerciseId] &&
                    savedData[today][exerciseId][setNumber];


                if (saved) {

                    const weightInput =
                        row.querySelector(".weight-input");

                    const repsInput =
                        row.querySelector(".reps-input");


                    weightInput.value =
                        saved.weight || "";


                    repsInput.value =
                        saved.reps || "";


                    if (saved.completed) {

                        row.classList.add("completed");

                        row.querySelector(
                            ".complete-button"
                        ).textContent = "✅ 完成";

                    }

                }


                /* AUTO SAVE INPUT */

                row.querySelectorAll("input")
                    .forEach(function(input) {

                        input.addEventListener(
                            "input",
                            function() {

                                saveCurrentSet(
                                    row,
                                    exerciseId,
                                    setNumber
                                );

                            }
                        );

                    });

            }


            updateProgress(exerciseDiv);


            workout.appendChild(exerciseDiv);

        });


        container.appendChild(workout);

    });

}


/* =================================================
   SAVE CURRENT SET
================================================= */

function saveCurrentSet(
    row,
    exerciseId,
    setNumber
) {

    const data = loadData();


    if (!data[today]) {
        data[today] = {};
    }


    if (!data[today][exerciseId]) {
        data[today][exerciseId] = {};
    }


    const weight =
        row.querySelector(".weight-input").value;


    const reps =
        row.querySelector(".reps-input").value;


    const completed =
        row.classList.contains("completed");


    data[today][exerciseId][setNumber] = {

        weight: weight,

        reps: reps,

        completed: completed

    };


    saveData(data);

}


/* =================================================
   COMPLETE SET
================================================= */

function completeSet(button) {

    const row =
        button.parentElement;


    if (
        row.querySelector(".weight-input").value === "" ||
        row.querySelector(".reps-input").value === ""
    ) {

        alert("请先输入重量和 Reps");

        return;

    }


    if (row.classList.contains("completed")) {

        row.classList.remove("completed");

        button.textContent =
            "⬜ 完成";

    } else {

        row.classList.add("completed");

        button.textContent =
            "✅ 完成";

    }


    const exercise =
        row.closest(".exercise");


    updateProgress(exercise);


    const exerciseId =
        exercise.dataset.exercise;


    const sets =
        exercise.querySelectorAll(".set-row");


    sets.forEach(function(set, index) {

        saveCurrentSet(
            set,
            exerciseId,
            index + 1
        );

    });

}


/* =================================================
   UPDATE PROGRESS
================================================= */

function updateProgress(exercise) {

    const sets =
        exercise.querySelectorAll(".set-row");


    let completed = 0;


    sets.forEach(function(set) {

        if (
            set.classList.contains("completed")
        ) {

            completed++;

        }

    });


    const progress =
        exercise.querySelector(
            ".set-progress span"
        );


    progress.textContent =
        completed +
        " / " +
        sets.length +
        " Sets";

}


/* =================================================
   CLEAR TODAY
================================================= */

function clearToday() {

    const confirmClear =
        confirm(
            "确定要清除今天所有训练记录吗？"
        );


    if (!confirmClear) {
        return;
    }


    const data = loadData();


    delete data[today];


    saveData(data);


    createWorkouts();

}


/* =================================================
   SECTION NAVIGATION
================================================= */

function scrollToSection(id) {

    const section =
        document.getElementById(id);


    if (section) {

        section.scrollIntoView({
            behavior: "smooth"
        });

    }

}


/* =================================================
   REST TIMER
================================================= */

let time = 180;

let timerInterval = null;


const bell =
    new Audio("images/bell.mp3");


const timerDisplay =
    document.getElementById("timer");


const restTime =
    document.getElementById("restTime");


const finishedMessage =
    document.getElementById("finishedMessage");


function updateTimer() {

    const minutes =
        Math.floor(time / 60);


    const seconds =
        time % 60;


    timerDisplay.textContent =
        minutes +
        ":" +
        seconds.toString().padStart(2, "0");

}


function setRest(seconds) {

    clearInterval(timerInterval);

    timerInterval = null;


    time = seconds;


    restTime.value =
        seconds;


    finishedMessage.style.display =
        "none";


    updateTimer();

}


function startTimer() {

    if (timerInterval !== null) {
        return;
    }


    if (time <= 0) {

        time =
            Number(restTime.value);

        updateTimer();

    }


    timerInterval =
        setInterval(function() {

            if (time > 0) {

                time--;

                updateTimer();

            } else {

                clearInterval(timerInterval);

                timerInterval = null;


                /* 🔔 BELL */

                bell.currentTime = 0;

                bell.play().catch(function(error) {

                    console.log(
                        "铃声播放失败:",
                        error
                    );

                });


                finishedMessage.style.display =
                    "block";


                setTimeout(function() {

                    finishedMessage.style.display =
                        "none";

                }, 5000);

            }

        }, 1000);

}


function pauseTimer() {

    clearInterval(timerInterval);

    timerInterval = null;

}


function resetTimer() {

    clearInterval(timerInterval);

    timerInterval = null;


    time =
        Number(restTime.value);


    finishedMessage.style.display =
        "none";


    updateTimer();

}


restTime.addEventListener(
    "change",
    function() {

        clearInterval(timerInterval);

        timerInterval = null;


        time =
            Number(this.value);


        finishedMessage.style.display =
            "none";


        updateTimer();

    }
);


/* =================================================
   START WEBSITE
================================================= */

createWorkouts();

updateTimer();

</script>

</body>
</html>
